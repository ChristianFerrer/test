<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f5c518">
  <title>Pickpocket Alert</title>

  <!-- Leaflet CSS - local copy to avoid CDN/integrity issues -->
  <link rel="stylesheet" href="lib/leaflet.css">
  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==================== LOCATION PERMISSION OVERLAY ==================== -->
  <div id="permission-overlay" class="permission-overlay hidden">
    <div class="perm-icon">📍</div>
    <h2>Necesitamos tu ubicación</h2>
    <p>Esta app necesita acceso a tu GPS para mostrarte alertas cercanas y enviarte alertas de carteristas en tiempo real.</p>
    <button class="btn-primary" id="request-location-btn">Activar ubicación</button>
  </div>

  <!-- ==================== APP HEADER ==================== -->
  <header class="app-header">
    <div class="header-logo">
      <span class="logo-icon">🕵️</span>
      <div class="logo-text">
        Pickpocket<strong>Alert</strong>
        <span>Alertas en tiempo real</span>
      </div>
    </div>
    <div class="header-right">
      <div class="gps-pill" id="gps-pill">
        <div class="gps-dot" id="gps-dot"></div>
        <span id="gps-label">Sin GPS</span>
      </div>
      <span id="alert-badge" class="badge hidden">0</span>
    </div>
  </header>

  <!-- ==================== MAP ==================== -->
  <div id="map"></div>

  <!-- ==================== BOTTOM PANEL ==================== -->
  <div id="bottom-panel" class="bottom-panel">
    <div class="panel-handle"></div>
    <div class="panel-row">
      <div class="panel-icon-wrap">
        <span class="panel-icon">🕵️</span>
      </div>
      <div class="panel-text-wrap">
        <div class="panel-title-text" id="panel-title-text">Carteristas detectados</div>
        <div class="panel-subtitle" id="panel-subtitle">Alertas activas en un radio de 50m</div>
      </div>
    </div>
  </div>

  <!-- ==================== ALERT BUTTON ==================== -->
  <button class="alert-button" id="alert-btn" aria-label="Enviar alerta de carterista">
    <span class="btn-icon">🕵️</span>
    <span class="btn-label" id="btn-label">REPORTAR</span>
  </button>

  <!-- ==================== BOTTOM NAVIGATION ==================== -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active" aria-label="Mapa en vivo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
      </svg>
      <span>Mapa</span>
    </a>
    <a href="history.html" class="nav-item" aria-label="Historial de alertas">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>Historial</span>
    </a>
    <a href="profile.html" class="nav-item" aria-label="Mi perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
      </svg>
      <span>Perfil</span>
    </a>
  </nav>

  <!-- ==================== SCRIPTS ==================== -->
  <!-- Leaflet JS - local copy -->
  <script src="lib/leaflet.js"></script>
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Shared utilities -->
  <script src="utils.js"></script>
  <!-- Main app logic -->
  <script src="app.js"></script>

</body>
</html>
