<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5c518">
  <title>Acceder - Whistle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

  <!-- ==================== LOGIN CARD ==================== -->
  <div class="auth-wrap">

    <!-- Logo -->
    <div class="auth-logo">
      <img class="auth-logo-icon" src="whistle.png" alt="Whistle" aria-hidden="true">
      <div class="auth-logo-text">
        <strong>Whistle</strong>
        <span data-i18n="login.tagline">Identifica carteristas a tu alrededor</span>
      </div>
    </div>

    <!-- Card -->
    <div class="auth-card" id="login-card">
      <h1 class="auth-title" data-i18n="login.title">Iniciar sesión</h1>

      <!-- Google OAuth -->
      <button class="btn-google" id="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.2 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-1.9 13.6-5l-6.3-5.2C29.4 35.6 26.8 36 24 36c-5.2 0-9.7-2.9-11.3-7.1l-6.6 4.9C9.7 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.8l6.3 5.2C41.4 35.5 44 30.1 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
        <span data-i18n="login.google">Continuar con Google</span>
      </button>

      <div class="auth-divider"><span data-i18n="login.or">o con email</span></div>

      <!-- Error message -->
      <div class="auth-error hidden" id="auth-error"></div>

      <!-- Email/password form -->
      <form id="login-form" autocomplete="on">
        <div class="field-group">
          <label class="field-label" for="email" data-i18n="login.email">Email</label>
          <input class="field-input" type="email" id="email" name="email"
            placeholder="tu@email.com" autocomplete="email" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="password" data-i18n="login.password">Contraseña</label>
          <input class="field-input" type="password" id="password" name="password"
            placeholder="••••••••" autocomplete="current-password" required minlength="6">
        </div>

        <button class="btn-primary btn-auth" type="submit" id="btn-login" data-i18n="login.submit">
          Entrar
        </button>
      </form>

      <!-- Switch to register -->
      <p class="auth-switch">
        <span data-i18n="login.no_account">¿Sin cuenta?</span>
        <button class="auth-link" id="btn-show-register" data-i18n="login.create">Crear cuenta</button>
      </p>
    </div>

    <!-- Register card (initially hidden) -->
    <div class="auth-card hidden" id="register-card">
      <h1 class="auth-title" data-i18n="register.title">Crear cuenta</h1>

      <div class="auth-error hidden" id="register-error"></div>

      <form id="register-form" autocomplete="on">
        <div class="field-group">
          <label class="field-label" for="reg-email" data-i18n="login.email">Email</label>
          <input class="field-input" type="email" id="reg-email" name="email"
            placeholder="tu@email.com" autocomplete="email" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="reg-password" data-i18n="login.password">Contraseña</label>
          <input class="field-input" type="password" id="reg-password" name="password"
            data-i18n-placeholder="register.password_ph"
            placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
        </div>

        <button class="btn-primary btn-auth" type="submit" id="btn-register" data-i18n="register.submit">
          Crear cuenta
        </button>
      </form>

      <p class="auth-switch">
        <span data-i18n="register.have_account">¿Ya tienes cuenta?</span>
        <button class="auth-link" id="btn-show-login" data-i18n="register.signin">Iniciar sesión</button>
      </p>
    </div>

  </div>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="utils.js"></script>
  <script src="i18n.js"></script>
  <script src="login.js"></script>
  <!-- iOS PWA install prompt -->
  <script src="ios-install.js"></script>

</body>
</html>
