<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Whistle body (main barrel) -->
  <rect x="10" y="38" width="55" height="26" rx="13" ry="13" fill="#1a1a1a"/>
  <!-- Mouthpiece -->
  <rect x="60" y="44" width="28" height="14" rx="7" ry="7" fill="#1a1a1a"/>
  <!-- Air chamber bump on top -->
  <rect x="18" y="28" width="28" height="16" rx="6" ry="6" fill="#1a1a1a"/>
  <!-- Pea (ball inside) -->
  <circle cx="32" cy="51" r="7" fill="#f5c518" opacity="0.9"/>
  <!-- Sound hole -->
  <ellipse cx="20" cy="51" rx="5" ry="6" fill="#f5c518"/>
  <!-- Ring/loop at end -->
  <circle cx="88" cy="51" r="7" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  <!-- Connector line -->
  <line x1="81" y1="51" x2="88" y2="51" stroke="#1a1a1a" stroke-width="5"/>
</svg>
