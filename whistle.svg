<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Boquilla (rectángulo rotado ~35°, arriba a la derecha) -->
  <rect x="48" y="4" width="42" height="22" rx="5" ry="5"
        transform="rotate(35 69 15)" fill="#1a1a1a"/>

  <!-- Cuerpo principal (círculo grande) -->
  <circle cx="38" cy="62" r="34" fill="#1a1a1a"/>

  <!-- Círculo interior blanco -->
  <circle cx="38" cy="62" r="18" fill="white"/>

  <!-- Círculo interior relleno -->
  <circle cx="38" cy="62" r="10" fill="#1a1a1a"/>

  <!-- Líneas de sonido (arriba izquierda del cuerpo) -->
  <line x1="22" y1="22" x2="15" y2="15" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="30" y1="16" x2="27" y2="7"  stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="14" y1="30" x2="5"  y2="27" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>

  <!-- Anilla abajo izquierda -->
  <circle cx="13" cy="88" r="7" fill="none" stroke="#1a1a1a" stroke-width="5"/>
</svg>
