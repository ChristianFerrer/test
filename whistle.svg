  <!-- Boquilla derecha -->
  <rect x="78" y="50" width="18" height="14" rx="7" fill="#1a1a1a"/>

  <!-- Bola interna -->
  <circle cx="40" cy="58" r="8" fill="#1a1a1a"/>
  <circle cx="40" cy="58" r="5" fill="#e0b000"/>

