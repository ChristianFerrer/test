<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f5c518">
  <meta name="apple-mobile-web-app-title" content="Whistle">
  <title>Historial - Whistle</title>

  <!-- Favicon + PWA icons -->
  <link rel="icon" type="image/png" href="whistle-icon.png">
  <link rel="apple-touch-icon" href="whistle-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="whistle-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Leaflet CSS - local copy -->
  <link rel="stylesheet" href="lib/leaflet.css">
  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==================== APP HEADER ==================== -->
  <header class="app-header">
    <div class="header-logo">
      <img class="logo-icon" src="whistle.png" alt="Whistle" aria-hidden="true">
      <div class="logo-text">
        <strong>Whistle</strong>
        <span data-i18n="history.tagline">Historial de alerta de carteristas</span>
      </div>
    </div>
    <div class="header-right">
      <div id="history-count" class="alert-badge-wrap hidden">
        <img src="thief2.png" class="badge-thief-icon" alt="">
        <span id="history-count-num" class="badge-count">0</span>
      </div>
    </div>
  </header>

  <!-- ==================== VIEW TOGGLE ==================== -->
  <div class="view-toggle-bar">
    <button class="toggle-btn active" id="btn-list" data-view="list" aria-label="Lista">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <button class="toggle-btn" id="btn-map" data-view="map" aria-label="Mapa">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
    </button>
    <div class="zone-toggle" id="zone-toggle">
      <button class="zone-btn active" id="zone-nearby" aria-label="Cerca de ti">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 2a10 10 0 0 0-10 10"/><path d="M12 22a10 10 0 0 1-10-10"/><path d="M12 22a10 10 0 0 0 10-10"/></svg>
        <span>Cerca</span>
      </button>
      <button class="zone-btn" id="zone-all" aria-label="Todas las zonas">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Todas</span>
      </button>
    </div>
    <div class="filter-bar">
      <button class="filter-pill active" id="filter-24h">24h</button>
      <button class="filter-pill" id="filter-7d">7d</button>
      <button class="filter-pill" id="filter-30d">30d</button>
    </div>
  </div>
  <!-- ==================== HOURLY CHART (fixed) ==================== -->
  <div id="hourly-chart-section" class="hourly-chart-section hidden">
    <div id="history-summary" class="history-summary"></div>
    <h2 class="history-section-title">Actividad por horas</h2>
    <div class="hourly-chart" id="hourly-chart"></div>
  </div>

  <!-- ==================== ALERT LIST (scrollable) ==================== -->
  <div id="list-view" class="alert-list-container">
    <h2 class="history-section-title" id="alerts-section-title" style="display:none;">Historial de alertas</h2>
    <div id="alerts-list-content">
      <div class="spinner" data-i18n="history.loading">Cargando alertas...</div>
    </div>
  </div>

  <!-- ==================== MAP VIEW ==================== -->
  <div id="map-view-container" class="hidden" style="position:fixed;top:calc(var(--header-height) + 48px);bottom:var(--bottom-bar-height);left:0;right:0;z-index:1;">
    <div id="history-map" style="width:100%;height:100%;"></div>
  </div>

  <!-- ==================== BOTTOM NAVIGATION ==================== -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Radar">
      <img src="radar.png" class="nav-icon-img" alt="">
      <span class="nav-label" data-i18n="nav.alert">Radar</span>
    </a>
    <a href="history.html" class="nav-item active" aria-label="Historial">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.history">Historial</span>
    </a>
    <a href="profile.html" class="nav-item" aria-label="Perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.profile">Perfil</span>
    </a>
    <a href="admin.html" id="admin-link" class="nav-item nav-admin hidden" aria-label="Admin">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.admin">Admin</span>
    </a>
  </nav>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="lib/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="utils.js"></script>
  <script src="i18n.js"></script>
  <script src="auth-guard.js"></script>
  <script src="history.js"></script>

</body>
</html>
