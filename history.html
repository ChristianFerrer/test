<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f5c518">
  <meta name="apple-mobile-web-app-title" content="Whistle">
  <title>Historial - Whistle</title>

  <!-- Favicon + PWA icons -->
  <link rel="icon" type="image/png" href="whistle-icon.png">
  <link rel="apple-touch-icon" href="whistle-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="whistle-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Leaflet CSS - local copy -->
  <link rel="stylesheet" href="lib/leaflet.css">
  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==================== APP HEADER ==================== -->
  <header class="app-header">
    <div class="header-logo">
      <img class="logo-icon" src="whistle.png" alt="Whistle" aria-hidden="true">
      <div class="logo-text">
        <strong>Whistle</strong>
        <span data-i18n="history.tagline">Historial de alerta de carteristas</span>
      </div>
    </div>
    <div class="header-right">
      <div id="history-count" class="alert-badge-wrap hidden">
        <img src="thief2.png" class="badge-thief-icon" alt="">
        <span id="history-count-num" class="badge-count">0</span>
      </div>
    </div>
  </header>

  <!-- ==================== VIEW TOGGLE ==================== -->
  <div class="view-toggle-bar">
    <div class="toggle-row">
      <button class="toggle-btn active" id="btn-list" data-view="list" aria-label="Lista">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <button class="toggle-btn" id="btn-map" data-view="map" aria-label="Mapa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </button>
      <div class="filter-dropdown-wrap" id="filter-dropdown-wrap">
        <button class="filter-dropdown-btn" id="filter-dropdown-btn" aria-label="Filtros">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <span id="filter-dropdown-label">Filtros</span>
          <svg class="filter-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="filter-dropdown-menu hidden" id="filter-dropdown-menu">
          <div class="filter-dropdown-group">
            <span class="filter-dropdown-group-title">Distancia</span>
            <label class="filter-dropdown-item"><input type="radio" name="zone" value="nearby" checked><span>Cerca</span></label>
            <label class="filter-dropdown-item"><input type="radio" name="zone" value="all"><span>Todas las zonas</span></label>
          </div>
          <div class="filter-dropdown-divider"></div>
          <div class="filter-dropdown-group">
            <span class="filter-dropdown-group-title">Periodo</span>
            <label class="filter-dropdown-item"><input type="radio" name="period" value="24" checked><span>24 horas</span></label>
            <label class="filter-dropdown-item"><input type="radio" name="period" value="168"><span>7 d&iacute;as</span></label>
            <label class="filter-dropdown-item"><input type="radio" name="period" value="720"><span>30 d&iacute;as</span></label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- ==================== HOURLY CHART (fixed) ==================== -->
  <div id="hourly-chart-section" class="hourly-chart-section hidden">
    <div class="horas-card">
      <div class="horas-header">
        <div class="horas-header-left">
          <svg class="horas-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          <span class="horas-title">Horas punta</span>
        </div>
        <div class="horas-header-right">
          <select class="horas-day-select" id="horas-day-select"></select>
        </div>
      </div>
      <div class="horas-realtime" id="horas-realtime"></div>
      <div class="hourly-chart" id="hourly-chart"></div>
      <div class="hourly-chart-labels" id="hourly-chart-labels"></div>
      <div id="history-summary" class="horas-footer"></div>
    </div>
  </div>

  <!-- ==================== ALERT LIST TITLE (fixed) ==================== -->
  <h2 class="history-section-title history-section-title--fixed" id="alerts-section-title">Historial de alertas</h2>

  <!-- ==================== ALERT LIST (scrollable) ==================== -->
  <div id="list-view" class="alert-list-container">
    <div id="alerts-list-content">
      <div class="spinner" data-i18n="history.loading">Cargando alertas...</div>
    </div>
  </div>

  <!-- ==================== MAP VIEW ==================== -->
  <div id="map-view-container" class="hidden" style="position:fixed;bottom:var(--bottom-bar-height);left:0;right:0;z-index:1;">
    <div id="history-map" style="width:100%;height:100%;"></div>
  </div>

  <!-- ==================== BOTTOM NAVIGATION ==================== -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Radar">
      <img src="radar.png" class="nav-icon-img" alt="">
      <span class="nav-label" data-i18n="nav.alert">Radar</span>
    </a>
    <a href="history.html" class="nav-item active" aria-label="Historial">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.history">Historial</span>
    </a>
    <a href="share.html" class="nav-item" aria-label="Compartir">
      <svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
      <span class="nav-label">Compartir</span>
    </a>
    <a href="profile.html" class="nav-item" aria-label="Perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.profile">Perfil</span>
    </a>
  </nav>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="lib/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="utils.js"></script>
  <script src="i18n.js"></script>
  <script src="auth-guard.js"></script>
  <script src="history.js"></script>

</body>
</html>
