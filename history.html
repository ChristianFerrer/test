<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f5c518">
  <meta name="apple-mobile-web-app-title" content="Whistle">
  <title>Historial - Whistle</title>

  <!-- Favicon + PWA icons -->
  <link rel="icon" type="image/png" href="whistle-icon.png">
  <link rel="apple-touch-icon" href="whistle-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="whistle-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Leaflet CSS - local copy -->
  <link rel="stylesheet" href="lib/leaflet.css">
  <!-- App styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==================== APP HEADER ==================== -->
  <header class="app-header">
    <div class="header-logo">
      <img class="logo-icon" src="whistle.png" alt="Whistle" aria-hidden="true">
      <div class="logo-text">
        <strong>Whistle</strong>
        <span>Alertas de carteristas en las últimas 24h en 5km a la redonda</span>
      </div>
    </div>
    <div class="header-right">
      <div id="history-count" class="alert-badge-wrap hidden">
        <img src="thief2.png" class="badge-thief-icon" alt="">
        <span id="history-count-num" class="badge-count">0</span>
      </div>
    </div>
  </header>

  <!-- ==================== VIEW TOGGLE ==================== -->
  <div class="view-toggle-bar">
    <button class="toggle-btn active" id="btn-list" data-view="list">Lista</button>
    <button class="toggle-btn" id="btn-map" data-view="map">Mapa</button>
  </div>

  <!-- ==================== LIST VIEW ==================== -->
  <div id="list-view" class="alert-list-container">
    <div class="spinner">Cargando alertas...</div>
  </div>

  <!-- ==================== MAP VIEW ==================== -->
  <div id="map-view-container" class="hidden" style="position:fixed;top:calc(var(--header-height) + 48px);bottom:var(--bottom-bar-height);left:0;right:0;z-index:1;">
    <div id="history-map" style="width:100%;height:100%;"></div>
  </div>

  <!-- ==================== BOTTOM NAVIGATION ==================== -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Alertar">
      <img src="radar.png" class="nav-icon-img" alt="">
    </a>
    <a href="history.html" class="nav-item active" aria-label="Historial de alertas">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </a>
    <a href="profile.html" class="nav-item" aria-label="Mi perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
      </svg>
    </a>
    <a href="admin.html" id="admin-link" class="nav-item nav-admin hidden" aria-label="Admin">
      <img src="settings.png" class="nav-icon-img" alt="">
    </a>
  </nav>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="lib/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="utils.js"></script>
  <script src="auth-guard.js"></script>
  <script src="history.js"></script>

</body>
</html>
