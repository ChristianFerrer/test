<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5c518">
  <meta name="apple-mobile-web-app-title" content="Whistle">
  <title>Perfil - Whistle</title>

  <!-- Favicon + PWA icons -->
  <link rel="icon" type="image/png" href="whistle-icon.png">
  <link rel="apple-touch-icon" href="whistle-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="whistle-icon.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==================== APP HEADER ==================== -->
  <header class="app-header">
    <div class="header-logo">
      <img class="logo-icon" src="whistle.png" alt="Whistle" aria-hidden="true">
      <div class="logo-text">
        <strong>Whistle</strong>
        <span data-i18n="profile.title">Mi perfil</span>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-logout" id="btn-logout" title="Cerrar sesión">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ==================== PROFILE CONTENT ==================== -->
  <div class="profile-scroll">

    <!-- Avatar + info -->
    <div class="profile-hero">
      <div class="profile-avatar" id="profile-avatar">?</div>
      <div class="profile-hero-info">
        <div class="profile-email" id="profile-email" data-i18n="profile.loading">Cargando...</div>
        <div class="profile-since" id="profile-since"></div>
      </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">–</span>
        <span class="stat-label" data-i18n="profile.stat_total">Alertas enviadas</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-today">–</span>
        <span class="stat-label" data-i18n="profile.stat_today">Hoy</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-streak">-</span>
        <span class="stat-label" data-i18n="profile.stat_streak">Racha</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-reach">-</span>
        <span class="stat-label" data-i18n="profile.stat_reach">~Personas avisadas</span>
      </div>
    </div>

    <!-- My recent alerts -->
    <div class="section-header">
      <span class="section-title" data-i18n="profile.my_alerts">Mis últimas alertas</span>
    </div>

    <div id="my-alerts-list" class="alert-list-container" style="position:relative;top:auto;bottom:auto;height:auto;max-height:100%;overflow-y:auto;">
      <div class="spinner">Cargando...</div>
    </div>

    <!-- Share Whistle button -->
    <button id="btn-share-whistle" class="btn-share-whistle" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      <span data-i18n="profile.share">Compartir Whistle</span>
    </button>

  </div>

  <!-- ==================== BOTTOM NAVIGATION ==================== -->
    <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Radar">
      <img src="radar.png" class="nav-icon-img" alt="">
      <span class="nav-label" data-i18n="nav.alert">Radar</span>
    </a>
    <a href="history.html" class="nav-item" aria-label="Historial">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.history">Historial</span>
    </a>
    <a href="profile.html" class="nav-item active" aria-label="Perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.profile">Perfil</span>
    </a>
    <a href="admin.html" id="admin-link" class="nav-item nav-admin hidden" aria-label="Admin">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.admin">Admin</span>
    </a>
  </nav>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="utils.js"></script>
  <script src="i18n.js"></script>
  <script src="auth-guard.js"></script>
  <script src="profile.js"></script>

</body>
</html>
