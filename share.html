<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5c518">
  <title>Compartir Whistle</title>
  <link rel="icon" type="image/png" href="whistle-icon.png">
  <link rel="apple-touch-icon" href="whistle-icon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow-y: auto !important;
      overflow-x: hidden;
    }

    /* ─── CONTENT ─── */
    .share-content {
      flex: 1;
      padding: 24px 16px calc(var(--bottom-bar-height, 64px) + 24px);
      padding-top: calc(var(--header-height, 56px) + 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .share-desc {
      text-align: center;
      margin-bottom: 28px;
    }
    .share-desc h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .share-desc p {
      font-size: 15px;
      color: #636366;
      line-height: 1.45;
    }

    /* ─── QR CARD ─── */
    .qr-card {
      background: linear-gradient(180deg, #f5c518 0%, #f3b800 100%);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 6px 24px rgba(245,197,24,0.3);
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .qr-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 50%);
      pointer-events: none;
    }
    .qr-card-logo {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      position: relative;
      z-index: 1;
    }
    .qr-card-brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin: 10px 0 4px;
      position: relative; z-index: 1;
    }
    .qr-card-tagline {
      font-size: 12px;
      font-weight: 600;
      color: rgba(28,28,30,0.7);
      margin-bottom: 14px;
      position: relative; z-index: 1;
    }
    .qr-wrap {
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.10);
      position: relative; z-index: 1;
    }
    .qr-wrap canvas, .qr-wrap img {
      display: block;
      width: 180px !important;
      height: 180px !important;
    }
    .qr-card-hint {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      position: relative; z-index: 1;
    }

    /* ─── DIVIDER ─── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 24px;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #d1d1d6;
    }

    /* ─── BUTTONS ─── */
    .share-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .btn-share {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .btn-share:active { transform: scale(0.97); }

    .btn-share--whatsapp {
      background: #25D366;
      color: #fff;
    }
    .btn-share--whatsapp:hover { background: #20bd5a; }

    .btn-share--copy {
      background: #1c1c1e;
      color: #f5c518;
    }
    .btn-share--copy:hover { background: #333; }
    .btn-share--copy.copied {
      background: #34c759;
      color: #fff;
    }

    .btn-share--other {
      background: #fff;
      color: #1c1c1e;
      border: 1.5px solid #d1d1d6;
    }
    .btn-share--other:hover { background: #f9f9fb; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-logo">
      <img class="logo-icon" src="whistle.png" alt="Whistle" aria-hidden="true">
      <div class="logo-text">
        <strong>Whistle</strong>
        <span>Compartir</span>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="share-content">

    <div class="share-desc">
      <h1>Comparte Whistle</h1>
      <p>Alerta de carteristas en tiempo real. Cuantas mas personas la usen, mas segura es tu zona.</p>
    </div>

    <!-- QR Card -->
    <div class="qr-card">
      <img class="qr-card-logo" src="whistle-icon.png" alt="Whistle">
      <div class="qr-card-brand">Whistle</div>
      <div class="qr-card-tagline">Alerta de carteristas en tiempo real</div>
      <div class="qr-wrap" id="qr-code"></div>
      <div class="qr-card-hint">Escanea para instalar</div>
    </div>

    <div class="divider">o enviar por</div>

    <!-- Share buttons -->
    <div class="share-buttons">
      <a class="btn-share btn-share--whatsapp" id="btn-whatsapp" href="#" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Enviar por WhatsApp
      </a>
      <button class="btn-share btn-share--copy" id="btn-copy">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copiar enlace
      </button>
      <button class="btn-share btn-share--other" id="btn-more" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Mas opciones
      </button>
    </div>

  </div>

  <!-- ==================== BOTTOM NAVIGATION ==================== -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item" aria-label="Radar">
      <img src="radar.png" class="nav-icon-img" alt="">
      <span class="nav-label" data-i18n="nav.alert">Radar</span>
    </a>
    <a href="history.html" class="nav-item" aria-label="Historial">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.history">Historial</span>
    </a>
    <a href="profile.html" class="nav-item" aria-label="Perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
      </svg>
      <span class="nav-label" data-i18n="nav.profile">Perfil</span>
    </a>
    <a href="share.html" class="nav-item active" aria-label="Compartir">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
      <span class="nav-label">Compartir</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <script src="utils.js"></script>
  <script>
  (function () {
    'use strict';

    var SHARE_URL = (location.origin && !location.origin.startsWith('file'))
      ? location.origin + '/landing.html'
      : 'https://whistle.app/landing.html';

    var SHARE_TEXT = 'Whistle te avisa en tiempo real si hay carteristas cerca de ti. Instalala gratis:';

    // QR code
    new QRCode(document.getElementById('qr-code'), {
      text: SHARE_URL,
      width: 180,
      height: 180,
      colorDark: '#1c1c1e',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H,
    });

    // WhatsApp
    var waUrl = 'https://wa.me/?text=' + encodeURIComponent(SHARE_TEXT + ' ' + SHARE_URL);
    document.getElementById('btn-whatsapp').href = waUrl;

    // Copy link
    var btnCopy = document.getElementById('btn-copy');
    btnCopy.addEventListener('click', async function () {
      var fullText = SHARE_TEXT + ' ' + SHARE_URL;
      try {
        await navigator.clipboard.writeText(fullText);
      } catch (e) {
        var ta = document.createElement('textarea');
        ta.value = fullText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (x) {}
        document.body.removeChild(ta);
      }
      btnCopy.classList.add('copied');
      btnCopy.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Enlace copiado';
      if (typeof vibrate === 'function') vibrate(10);
      setTimeout(function () {
        btnCopy.classList.remove('copied');
        btnCopy.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copiar enlace';
      }, 2500);
    });

    // "More options" button — only show if Web Share API is available
    var btnMore = document.getElementById('btn-more');
    if (navigator.share) {
      btnMore.style.display = 'flex';
      btnMore.addEventListener('click', function () {
        navigator.share({ title: 'Whistle', text: SHARE_TEXT, url: SHARE_URL }).catch(function () {});
      });
    }

  })();
  </script>

</body>
</html>
